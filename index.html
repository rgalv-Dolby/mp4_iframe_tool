<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP4 I-Frame Viewer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MP4 analysis</p>
          <h1>I-frame viewer</h1>
        </div>
      </header>

      <section class="panel upload-panel">
        <label for="file-input" class="upload-label">Choose MP4</label>
        <input id="file-input" type="file" accept="video/mp4,.mp4" />
        <p id="file-name" class="file-name">No file selected</p>
      </section>

      <section class="panel summary-panel">
        <div class="summary-row">
          <div class="stat-card">
            <span class="label">Sync sample count</span>
            <strong id="sample-count">0</strong>
          </div>
          <div class="stat-card">
            <span class="label">I-frame interval</span>
            <strong id="interval-value">N/A</strong>
          </div>
          <div class="stat-card">
            <span class="label">Variation</span>
            <strong id="variability-value">Unknown</strong>
          </div>
        </div>

        <div class="analysis-row">
          <span class="status-label">Status</span>
          <span id="status-badge" class="status-badge neutral">Waiting</span>
        </div>

        <p id="result-summary" class="result-summary">Upload an MP4 file to inspect its sync samples.</p>
      </section>

      <section class="panel table-panel">
        <h2>Detected sync samples / I-frames</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Sample number</th>
                <th>Delta from prev.</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="iframe-table-body">
              <tr>
                <td colspan="4" class="empty">Waiting for MP4 upload</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
